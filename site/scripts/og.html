<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {margin: 0; width: 1200px; height: 630px; overflow: hidden}
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 84px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #221b17;
    background: radial-gradient(700px 500px at 100% 0, #f3d9cf, transparent 70%), radial-gradient(600px 500px at 0 100%, #ece1d2, transparent 70%), #f7f2eb;
  }
  .brand {display: flex; align-items: center; gap: 18px; font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif; font-size: 40px; font-weight: 600; letter-spacing: -.8px}
  .mark {display: grid; place-items: center; width: 68px; height: 68px; border-radius: 16px; background: linear-gradient(170deg, #d93f3f, #751820); box-shadow: inset 0 1px 1px #ffffff66, 0 10px 24px #9e212933}
  h1 {margin: 0; max-width: 980px; font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif; font-size: 82px; font-weight: 500; line-height: 1.04; letter-spacing: -2.8px}
  em {color: #9e2129}
  .foot {display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #574f49}
  .ticket {padding: 14px 30px; border-radius: 8px; color: #fff; font-weight: 600; background: linear-gradient(175deg, #d4434a, #c8323a 55%, #9e2129);
    -webkit-mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat}
</style>
</head>
<body>
  <div class="brand"><div class="mark"><svg width="46" height="46" viewBox="0 0 32 32"><path d="M13 9.4a3 3 0 1 1 4.4 2.6c-.9.5-1.4 1.1-1.4 2v.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M16 14.6 4.7 22.4c-1.1.8-.6 2.5.8 2.5h21c1.4 0 1.9-1.7.8-2.5L16 14.6Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>Coat Check</div>
  <h1>The notch hides your menu bar icons. <em>Coat Check hands them back.</em></h1>
  <div class="foot"><span>Free · Open source · macOS 14+</span><span class="ticket">coatcheckformac.com</span></div>
</body>
</html>
