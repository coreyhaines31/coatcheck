<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@300;600;700&display=swap">
<style>
  html, body {margin: 0; width: 1200px; height: 630px; overflow: hidden}
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 84px 68px;
    font-family: "Barlow", system-ui, sans-serif;
    color: #161616;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.22) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 3px), repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 7px), linear-gradient(100deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.5) 40%, rgba(255,255,255,0) 64%), linear-gradient(180deg, #e7e8e9, #c3c5c7);
  }
  .brand {display: flex; align-items: center; gap: 18px; font: 700 42px/1 "Barlow Semi Condensed", sans-serif}
  .brand img {width: 76px; height: 76px}
  h1 {margin: 0; max-width: 1000px; font: 600 88px/.97 "Barlow Semi Condensed", sans-serif}
  h1 span {font-weight: 300}
  .foot {display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: #3d3f41}
  .plate {display: inline-flex; gap: 12px; align-items: center; font: 600 18px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .24em; text-transform: uppercase; background: #1b1b1b; color: #d8d9da; padding: 11px 18px 11px 15px; border-radius: 2px}
  .plate i {width: 10px; height: 10px; border-radius: 50%; background: #c4366f; box-shadow: 0 0 7px #c4366f}
</style>
</head>
<body>
  <div class="brand"><img src="../src/assets/family/coat.png" alt="">Coat Check</div>
  <h1>The notch hides your menu bar icons. <span>Coat Check hands them back.</span></h1>
  <div class="foot"><span>Free · Open source · macOS 14+</span><span class="plate"><i></i>coatcheckformac.com</span></div>
</body>
</html>
